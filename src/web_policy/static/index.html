<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Policy Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="viewer" aria-label="MuJoCo policy demo viewer">
        <div id="viewport"></div>
        <div id="loading">Loading scene</div>
        <div class="viewer-help">
          <span><b>Command:</b> use the panel controls or configured hotkeys</span>
          <span><b>View:</b> left drag empty space · wheel zoom</span>
          <span><b>Force:</b> left drag robot · Torque: right drag robot</span>
        </div>
      </section>
      <aside class="panel">
        <header>
          <h1>Policy Viewer</h1>
          <p id="subtitle">MuJoCo ONNX policy</p>
        </header>

        <div class="toolbar" aria-label="simulation controls">
          <button id="run" type="button">Pause</button>
          <button id="reset" type="button">Reset</button>
          <button id="switch-policy" type="button">Switch</button>
        </div>
        <div class="toolbar secondary" aria-label="viewer controls">
          <button id="follow" type="button">Follow</button>
          <button id="contacts" type="button">Contacts</button>
          <button id="view-home" type="button" title="Reset camera view">Home</button>
        </div>

        <section class="readout" aria-label="status">
          <div><span>Policy</span><strong id="policy">-</strong></div>
          <div><span>Time</span><strong id="time">0.000 s</strong></div>
          <div><span>Height</span><strong id="height">0.000 m</strong></div>
          <div><span>Real Time Factor</span><strong id="rtf">0.00</strong></div>
        </section>

        <section id="command-controls" class="sticks" aria-label="policy command"></section>

        <footer>
          <span id="connection">Connecting</span>
        </footer>
      </aside>
    </main>
    <script src="/static/vendor/three.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
