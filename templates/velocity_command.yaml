command:
  title: "Velocity Command"
  dims:
    - name: lin_vel_x
      label: "Lin Vel X"
      type: slider
      min: -0.5
      max: 1.0
      step: 0.1
      default: 0.0
      unit: "m/s"
      hotkeys:
        positive: KeyW
        negative: KeyS

    - name: lin_vel_y
      label: "Lin Vel Y"
      type: slider
      min: -0.5
      max: 0.5
      step: 0.1
      default: 0.0
      unit: "m/s"
      hotkeys:
        positive: KeyA
        negative: KeyD

    - name: ang_vel_yaw
      label: "Ang Vel Yaw"
      type: slider
      min: -1.5
      max: 1.5
      step: 0.1
      default: 0.0
      unit: "rad/s"
      hotkeys:
        positive: KeyQ
        negative: KeyE
