[project]
name = "policy-web-viewer"
version = "0.1.0"
description = "Browser-based MuJoCo viewer for trained Unitree policy checkpoints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.6.0",
    "numpy",
]

[project.scripts]
policy-web-viewer = "policy_web_viewer.server:main"
policy-web-viewer-export = "policy_web_viewer.export:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policy_web_viewer = ["static/**/*"]

[tool.setuptools.exclude-package-data]
policy_web_viewer = ["**/__pycache__/*", "**/*.pyc"]
